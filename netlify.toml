[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  SITE_URL = "https://supercarspassion.com"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirects for the WordPress permalinks this site was migrated from.
#
# Articles are served at /articles/:slug/, but the imported prose still links
# to the old dated scheme (/2026/03/01/ferrari-history/) and to bare slugs
# (/ferrari-history/). All 418 of those links returned 404.
#
# Redirecting rather than rewriting the prose keeps the articles untouched and
# also rescues inbound links and search results still pointing at the old
# permalinks, which editing the Markdown would not.
#
# Explicit rules come first because Netlify takes the first match; the catch-all
# at the end handles old URLs nothing here links to.

[[redirects]]
  from = "/2026/01/14/bugatti-chiron-aerospace-engineering"
  to = "/articles/why-the-bugatti-chiron-is-closer-to-aerospace-than-to-automotive-engineering/"
  status = 301

